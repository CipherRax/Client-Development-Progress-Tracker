services:
  trackly-postgres:
    image: postgres:16-alpine
    container_name: trackly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackly
      POSTGRES_PASSWORD: trackly_password
      POSTGRES_DB: trackly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trackly -d trackly']
      interval: 5s
      timeout: 5s
      retries: 10

  trackly-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackly-api
    restart: unless-stopped
    depends_on:
      trackly-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://trackly:trackly_password@trackly-postgres:5432/trackly?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_PUBLIC_URL: ${CLIENT_PUBLIC_URL:-http://localhost:3000/p}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_LIMIT: 100
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  postgres_data:
